# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion del mal

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano: 
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - lex luthor
          - braniac
          - joker
          - harley quinn
          
      cow_character:
          description: "Personaje"
          required: true
          type: choice
          options:
            - eyes
            - daemon
            - dragon
            - ghostbusters
            - king

      mensaje:
        description: "Mensaje para el consejo de villanos"
        required: true
        default: "la mision fue un exito" 

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - alta
          - media
          - baja 
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

  
    steps:

      - name: isntalar el transmisor de la legion
        run: sudo apt-get install -y cowsay
      
      - name: Imprimir inputs
        run: |
          echo "============================"
          echo "    Transmición interceptada"
          echo "============================="
          echo ""
          echo "DE: ${{inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u + "%d/%m/%Y %H:%M UTC")"

          echo "---- MENSAJE----"
          cowsay -f "${{inputs.cow_character}}" "${{inputs.mensaje}}"
          echo ""
          echo "----${{inputs.villano}}"
          echo "..."
