# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion del mal

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano: 
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - lex luthor
          - braniac
          - joker
          - harley quinn

      mensaje:
        description: "Mensaje para el consejo de villanos"
        required: true
        default: "la mision fue un exito" 

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - alta
          - media
          - baja 
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

  
    steps:
      
      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo ""
          echo "villanos: ${{inputs.villano }}"
          echo "mensaje: ${{inputs.mensaje }}"
          echo "Nivel: ${{inputs.prioridad }}"
