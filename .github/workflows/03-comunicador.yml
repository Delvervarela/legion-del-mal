# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion del mal

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano: 
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - lex luthor
          - braniac
          - joker
          - harley quinn

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

  
    steps:
      - uses: actions/checkout@v4

