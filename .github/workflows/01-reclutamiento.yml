name: 01-reclutamiento de agente

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    steps: 
      - name: El agente se presenta 
        run: echo "Hola, soy lex luthor, y estoy aquí para reclutar agentes para mi organización secreta."

      - name: Reporte de identidad 
        run: |
          echo "reporte de identidad"
          echo "---------------------"
          echo ""
          echo "Nombre clave: ${{ github.actor }}"
          echo ""
          echo "Contexto de Github"
          echo "Repo: ${{ github.repository }}"
          echo "Operación: ${{ github.sha }}"
          echo "Metadata: ${{ toJSON(github) }}"

      - name: Capacidades del agente
        run: |
          echo : "Capacidades del agente"
          echo "Sistema opertativo"
          uname -a
          echo "habilidaes tecnicas"
          node --version
          git --version
          python --version

      - name: Reconocimiento del terreno
        run: |
          echo "Reconocimiento del terreno"
          ls /
             