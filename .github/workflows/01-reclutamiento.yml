name: 01-reclutamiento de agente

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    steps: 
      - name: El agente se presenta 
        run: echo "Hola, soy lex luthor, y estoy aquí para reclutar agentes para mi organización secreta. Si estás interesado en unirte 
             a nosotros, por favor envía tu solicitud a través de nuestro formulario de reclutamiento en línea. 
             ¡Esperamos contar contigo!"

      - name: Reporte de identidad 
        run: 
          echo "reporte de identidad"
          echo "---------------------"
          echo ""
          echo "Nombre clave: ${{ github.actor }}"
          echo ""
          echo "Contexto de Github"
          echo "Repo: ${{ github.repository }}"
          echo "Operación: ${{ github.sha }}"
          echo "Metadata: ${{ toJSON(github) }}"
             